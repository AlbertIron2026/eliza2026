<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eliza</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f0f2f5; margin: 0;
           display: flex; justify-content: center; }
    #app { width: 100%; max-width: 600px; height: 100vh; display: flex;
           flex-direction: column; background: #fff; }
    header { padding: 12px 16px; background: #4a6fa5; color: #fff;
             display: flex; justify-content: space-between; align-items: center; }
    header button { background: transparent; color: #fff; border: 1px solid #fff;
                    border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex;
            flex-direction: column; gap: 8px; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 14px; line-height: 1.4; }
    .user { align-self: flex-end; background: #4a6fa5; color: #fff; }
    .bot  { align-self: flex-start; background: #e4e6eb; color: #111; }
    #form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ddd; }
    #input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px;
             font-size: 1rem; }
    #send { padding: 10px 16px; border: none; border-radius: 8px;
            background: #4a6fa5; color: #fff; cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <strong>Eliza</strong>
      <button id="reset">Nueva conversación</button>
    </header>
    <div id="chat"></div>
    <div id="form">
      <input id="input" type="text" placeholder="Escribe aquí..." autocomplete="off">
      <button id="send">Enviar</button>
    </div>
  </div>

  <script>
    const API = "/api/chat";
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");

    // El sessionId se guarda en el navegador para conservar la conversación al recargar
    let sessionId = localStorage.getItem("sessionId");
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      localStorage.setItem("sessionId", sessionId);
    }

    function addMessage(sender, text) {
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function loadHistory() {
      const res = await fetch(API + "/" + sessionId);
      const messages = await res.json();
      messages.forEach(m => addMessage(m.sender, m.text));
      if (messages.length === 0) {
        addMessage("bot", "Hola, soy Eliza. ¿Cómo te encuentras hoy?");
      }
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      addMessage("user", text);

      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId: sessionId, message: text })
      });
      const data = await res.json();
      addMessage("bot", data.reply);
    }

    document.getElementById("send").addEventListener("click", send);
    input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
    document.getElementById("reset").addEventListener("click", () => {
      localStorage.removeItem("sessionId");
      location.reload();
    });

    loadHistory();
  </script>
</body>
</html>
